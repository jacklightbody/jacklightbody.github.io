<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" type="text/css" href="assets/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Volkhov:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Lightbody</title>
</head>

<body class="index">
    <div class="container">
        <div class="main">
            <h1 class="intro">Jack Lightbody</h1>
            <p>
                Software Engineer.
                Formerly <a href="https://angellist.com" class="angellist">@AngelList</a>, <a href="https://amazon.com"
                    class="amazon">@Amazon</a>, <a href="https://www.carleton.edu" class="carleton">@Carleton College
                    CS</a>.</p>
            <p>Read my <a href="writing">writing</a> or <a
                    href='mai&#108;to&#58;%6Aack&#46;lightbo%&#54;4y&#64;g&#109;a&#105;l%&#50;&#69;c&#111;&#109;'>get in
                    touch</a>.</p>
        </div>
    </div>
    <script>
        (function () {
            var el = document.querySelector('.index .main');
            if (!el) return;
            var edge = 12;
            var vw = document.documentElement.clientWidth;
            var vh = document.documentElement.clientHeight;
            var r = el.getBoundingClientRect();
            var dx = (Math.random() * 2 - 1) * 0.12 * vw;
            var dy = (Math.random() * 2 - 1) * 0.12 * vh;
            dx = Math.max(edge - r.left, Math.min(vw - edge - r.right, dx));
            dy = Math.max(edge - r.top, Math.min(vh - edge - r.bottom, dy));
            el.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
            r = el.getBoundingClientRect();
            if (r.left < edge) dx += edge - r.left;
            if (r.right > vw - edge) dx -= r.right - (vw - edge);
            if (r.top < edge) dy += edge - r.top;
            if (r.bottom > vh - edge) dy -= r.bottom - (vh - edge);
            el.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
            el.style.opacity = '1';
        })();
    </script>
</body>

</html>
